<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Hotello - AI-Powered Hotel Booking in Sri Lanka | Best Prices Guaranteed</title>
    <meta name="title" content="Hotello - AI-Powered Hotel Booking in Sri Lanka | Best Prices Guaranteed" />
    <meta name="description" content="Discover and book the perfect hotel in Sri Lanka with Hotello's AI-powered search. Compare prices, get personalized recommendations, and enjoy seamless booking with our intelligent chatbot assistant." />
    <meta name="keywords" content="hotel booking Sri Lanka, AI hotel search, Sri Lanka hotels, best hotel prices, hotel booking platform, accommodation Sri Lanka, AI travel assistant, hotel deals Sri Lanka" />
    <meta name="author" content="Hotello" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />
    <meta name="theme-color" content="#f59e0b" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://hotello-ebon.vercel.app/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hotello-ebon.vercel.app/" />
    <meta property="og:title" content="Hotello - AI-Powered Hotel Booking in Sri Lanka" />
    <meta property="og:description" content="Discover and book the perfect hotel in Sri Lanka with Hotello's AI-powered search. Best prices guaranteed with personalized recommendations." />
    <meta property="og:image" content="https://hotello-ebon.vercel.app/bg-hero.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Hotello" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://hotello-ebon.vercel.app/" />
    <meta name="twitter:title" content="Hotello - AI-Powered Hotel Booking in Sri Lanka" />
    <meta name="twitter:description" content="Discover and book the perfect hotel in Sri Lanka with Hotello's AI-powered search. Best prices guaranteed." />
    <meta name="twitter:image" content="https://hotello-ebon.vercel.app/bg-hero.webp" />
    
    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    
    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Preload critical hero image for faster LCP -->
    <link rel="preload" as="image" href="/bg-hero.webp" fetchpriority="high" />
    
    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TravelAgency",
      "name": "Hotello",
      "description": "AI-powered hotel booking platform for Sri Lanka",
      "url": "https://hotello-ebon.vercel.app",
      "logo": "https://hotello-ebon.vercel.app/logo.png",
      "image": "https://hotello-ebon.vercel.app/bg-hero.webp",
      "sameAs": [
        "https://facebook.com/hotello",
        "https://twitter.com/hotello",
        "https://instagram.com/hotello"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+94-11-xxx-xxxx",
        "contactType": "Customer Service",
        "areaServed": "LK",
        "availableLanguage": ["English", "Sinhala"]
      },
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "LK",
        "addressLocality": "Colombo"
      }
    }
    </script>
    
    <!-- Structured Data - Website -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Hotello",
      "url": "https://hotello-ebon.vercel.app",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://hotello-ebon.vercel.app/hotels?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
